<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f9f9f9; color: #333; }
        
        /* Portada Principal */
        .portada {
            position: relative;
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('portada.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .portada h1 { font-size: 2.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .portada p { font-size: 1.2rem; opacity: 0.9; }

        /* Contenedor del Catálogo */
        .catalogo-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .titulo-seccion { text-align: center; margin-bottom: 30px; font-size: 1.8rem; position: relative; padding-bottom: 10px; }
        .titulo-seccion::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 50px; height: 3px; background-color: #333; }

        /* Cuadrícula de Productos */
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .producto-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .producto-card:hover { transform: translateY(-5px); }
        .producto-img { width: 100%; height: 300px; object-fit: cover; background-color: #eaeaea; }
        .producto-info { padding: 20px; text-align: center; }
        .producto-titulo { font-size: 1.1rem; margin-bottom: 8px; font-weight: 600; }
        .producto-precio { color: #e67e22; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

    <!-- PORTADA -->
    <header class="portada">
        <h1>Bienvenidos a Nuestro Catálogo</h1>
        <p>Descubre nuestra colección exclusiva</p>
    </header>

    <!-- SECCIÓN DE PRODUCTOS -->
    <main class="catalogo-container">
        <h2 class="titulo-seccion">Nuestros Productos</h2>
        
        <div class="grid-productos">
            <!-- Producto 1 -->
            <div class="producto-card">
                <img src="imagen1.jpg" alt="Producto 1" class="producto-img">
                <div class="producto-info">
                    <div class="producto-titulo">Nombre del Producto 1</div>
                    <div class="producto-precio">$0.00</div>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="producto-card">
                <img src="imagen2.jpg" alt="Producto 2" class="producto-img">
                <div class="producto-info">
                    <div class="producto-titulo">Nombre del Producto 2</div>
                    <div class="producto-precio">$0.00</div>
                </div>
            </div>

            <!-- Puedes copiar y pegar el bloque de "Producto" para añadir tantos como necesites -->
        </div>
    </main>

</body>
</html>
